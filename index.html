<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#20183C">
<title>LinkedIn Snake 🐍</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#20183C;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:10;
  transition:opacity .3s ease,visibility .3s ease}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
/* MENU */
#menuScreen{background:linear-gradient(160deg,#0f0b24 0%,#20183C 60%,#1a2a1e 100%)}
.menu-logo{animation:floatBob 2.8s ease-in-out infinite;margin-bottom:20px}
@keyframes floatBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.game-title{font-size:clamp(2.2rem,9vw,4.5rem);font-weight:900;color:#F8B725;
  letter-spacing:-3px;line-height:.95;text-align:center;text-shadow:0 4px 30px rgba(248,183,37,.35)}
.game-sub{font-size:clamp(.75rem,2.5vw,1rem);color:#FFF1CB;opacity:.65;margin-top:10px;text-align:center}
.menu-btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 40px;border-radius:50px;font-size:1rem;font-weight:700;cursor:pointer;
  border:none;min-width:210px;transition:transform .15s,box-shadow .15s,background .15s}
.btn:active{transform:scale(.96)!important}
.btn-primary{background:#F8B725;color:#20183C;box-shadow:0 4px 24px rgba(248,183,37,.4)}
.btn-primary:hover{box-shadow:0 8px 32px rgba(248,183,37,.6);transform:translateY(-2px)}
.btn-ghost{background:transparent;color:#FFF1CB;border:2px solid rgba(255,241,203,.3)}
.btn-ghost:hover{background:rgba(255,241,203,.08)}
.menu-hs{color:rgba(255,241,203,.5);font-size:.85rem;margin-top:20px}
.menu-hs strong{color:#F8B725}
.menu-hint{color:rgba(255,241,203,.35);font-size:.72rem;margin-top:14px;text-align:center;line-height:1.7}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:center;padding:14px 18px;z-index:20;pointer-events:none;
  transition:opacity .3s,visibility .3s}
#hud.hidden{opacity:0;visibility:hidden}
.hud-pill{background:rgba(20,15,50,.82);backdrop-filter:blur(12px);
  border-radius:50px;padding:8px 18px;border:1.5px solid rgba(255,255,255,.1);
  pointer-events:all}
.hud-score{color:#F8B725;font-size:1.3rem;font-weight:800}
.hud-level{color:#A27EBF;font-size:.8rem;font-weight:600}
.hud-pausebtn{color:#FFF1CB;font-size:.85rem;font-weight:600;cursor:pointer;
  transition:background .15s}
.hud-pausebtn:hover{background:rgba(255,255,255,.12)}
/* PAUSE */
#pauseScreen{background:rgba(12,8,30,.88);backdrop-filter:blur(24px)}
.overlay-title{font-size:clamp(2rem,7vw,3.2rem);font-weight:900;margin-bottom:30px}
/* GAMEOVER */
#gameOverScreen{background:rgba(12,8,30,.9);backdrop-filter:blur(24px)}
.go-title{font-size:clamp(2rem,7vw,3rem);font-weight:900;color:#e1582e;margin-bottom:6px}
.go-score{font-size:1rem;color:rgba(255,241,203,.75);margin-bottom:8px}
.go-score span{color:#F8B725;font-size:2.2rem;font-weight:900;display:block;margin-top:4px}
.go-hs{font-size:.82rem;color:rgba(255,241,203,.45);margin-bottom:28px}
.go-hs strong{color:#A27EBF}
/* POPUPS */
#popupLayer{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.popup{position:absolute;background:#fff;border-radius:10px;padding:9px 14px;
  font-size:clamp(.68rem,2.2vw,.88rem);font-weight:600;color:#20183C;
  box-shadow:0 6px 28px rgba(0,0,0,.25);max-width:min(260px,66vw);
  word-wrap:break-word;text-align:center;border-left:4px solid #0077B5;
  line-height:1.45;white-space:normal;
  animation:popAnim 3s cubic-bezier(.4,0,.2,1) forwards}
@keyframes popAnim{
  0%{opacity:0;transform:scale(.6) translateY(8px)}
  12%{opacity:1;transform:scale(1.05) translateY(-6px)}
  20%{transform:scale(1) translateY(-12px)}
  70%{opacity:1;transform:scale(1) translateY(-22px)}
  100%{opacity:0;transform:scale(.9) translateY(-44px)}}
/* SOUND BTN */
#sfxBtn{position:fixed;bottom:18px;right:18px;z-index:25;
  width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,.15);
  background:rgba(20,15,50,.82);backdrop-filter:blur(10px);
  color:#FFF1CB;font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .3s,visibility .3s}
#sfxBtn.hidden{opacity:0;visibility:hidden}
/* Particles */
#particleLayer{position:fixed;inset:0;pointer-events:none;z-index:22;overflow:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-pill hud-score">🐍 <span id="scoreVal">0</span></div>
  <div class="hud-pill hud-level" id="levelVal">Nivå 1</div>
  <div class="hud-pill hud-pausebtn" onclick="togglePause()">⏸ Pause</div>
</div>

<!-- Menu -->
<div id="menuScreen" class="screen">
  <svg class="menu-logo" width="72" height="72" viewBox="0 0 72 72"><rect width="72" height="72" rx="13" fill="#0077B5"/><text x="36" y="50" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="36" fill="white">in</text></svg>
  <h1 class="game-title">LinkedIn<br>Snake</h1>
  <p class="game-sub">Det norske næringslivets favorittspill</p>
  <div class="menu-btns">
    <button class="btn btn-primary" onclick="startGame()">🚀 Spill nå</button>
    <button class="btn btn-ghost" id="menuSfxBtn" onclick="toggleSound()">🔊 Lyd på</button>
  </div>
  <div class="menu-hs" id="menuHs">Rekord: <strong>0</strong></div>
  <p class="menu-hint">Piltaster / WASD på PC &nbsp;·&nbsp; Sveip på mobil<br>ESC eller P for pause</p>
</div>

<!-- Pause -->
<div id="pauseScreen" class="screen hidden">
  <div class="overlay-title" style="color:#F8B725">⏸ Pause</div>
  <div class="menu-btns">
    <button class="btn btn-primary" onclick="resumeGame()">▶ Fortsett</button>
    <button class="btn btn-ghost" onclick="goToMenu()">🏠 Tilbake til meny</button>
  </div>
</div>

<!-- Game Over -->
<div id="gameOverScreen" class="screen hidden">
  <div class="go-title">💼 Game Over</div>
  <div class="go-score">Du spiste <span id="finalScore">0</span> LinkedIn-innlegg</div>
  <div class="go-hs" id="goHs">Rekord: <strong>0</strong></div>
  <div class="menu-btns">
    <button class="btn btn-primary" onclick="startGame()">🔄 Prøv igjen</button>
    <button class="btn btn-ghost" onclick="goToMenu()">🏠 Meny</button>
  </div>
</div>

<div id="popupLayer"></div>
<div id="particleLayer"></div>
<button id="sfxBtn" class="hidden" onclick="toggleSound()">🔊</button>

<script>
// ═══════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════
const C = {
  yellow:'#F8B725', purple:'#A27EBF', red:'#e1582e',
  dark:'#20183C',  green:'#6CAE7B',  cream:'#FFF1CB',
  gray:'#F9F8F7',  linkedin:'#0077B5',
  tileW: 64, tileH: 32, wallH: 26,
  gridW: 32, gridH: 32,
  initSpeed: 195, minSpeed: 82, speedStep: 4,
};

const QUOTES = [
  '"Stolt & ydmyk"','Takk for at du deler!','Dette er såå sant',
  'Endelig kan jeg dele...','🚀🚀🚀','Faglig påfyll','Tankeleder',
  'AI forandrer måten vi jobber på','Arendalsuka – vi sees!',
  'Jeg er klar for nye eventyr! 👋','Jeg er klar for nye utfordringer',
  'Gleder meg til å ta fatt på nye utfordringer',
  'Kommentarer gir mer rekkevidde','Podcast ute nå',
  'Brenner for [generisk norsk tema]','Fredagspåfyll ☕️',
  'Tverrfaglig team','Lavthengende frukter','Paradigmeskifte',
  'Takk for en spennende workshop','Utrolig takknemlig','Synergi i praksis',
  'KI-strategi','La oss være ærlige','Gratulerer med ny jobb 🎉',
  'Jeg bruker faktisk tankestrek ofte','Foto: Øyvind Ganesh',
  'Din personlige merkevare','Jeg starter nå for meg selv',
  'LinkedIn er en circle jerk','LinkedIn-eliten bestemmer over deg',
  'For mye positivitet på LinkedIn','Lag den feeden du ønsker selv',
  'Hjelper ledere å kommunisere bedre','Hjelper deg å skinne i sosiale medier',
  'Heier på dette!','Hjelper deg å vokse på LinkedIn',
  'Kommenter JA for å få oppskriften min',
  'Kommenter SNAKE for å få oppskriften min',
  'Forrige uke holdt jeg foredrag hos [norsk selskap]',
  'Hva er dine beste tips for å lykkes?',
  'Hva mener du? Kommenter under','Kjør debatt!','Neida. Joda.','Fin post.',
  'Vær deg selv','Jeg har betalt 10k for dette. Nå gir jeg det ut gratis.',
  'Hva tror du? 💭','Noen ting er viktigere enn andre. Dette er det.'
];

// ═══════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════
const Audio = (() => {
  let ac=null, master=null, sfxG=null, musG=null;
  let enabled=true, musPlaying=false, musTimer=null, noteIdx=0;

  const init = () => {
    if(ac) return;
    try {
      ac = new (window.AudioContext||window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value=1; master.connect(ac.destination);
      sfxG = ac.createGain(); sfxG.gain.value=0.55; sfxG.connect(master);
      musG = ac.createGain(); musG.gain.value=0.18; musG.connect(master);
    } catch(e){}
  };

  const resume = () => ac && ac.state==='suspended' && ac.resume();

  const tone = (freq,type,dur,vol,dest,delay=0) => {
    if(!ac||!enabled) return;
    try {
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=freq;
      o.connect(g); g.connect(dest);
      const t=ac.currentTime+delay;
      g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.start(t); o.stop(t+dur+.01);
    } catch(e){}
  };

  const setEnabled = (v) => {
    enabled=v;
    if(master) master.gain.value = v?1:0;
    if(v) resume();
  };

  const eat = () => {
    tone(660,'sine',.08,.6,sfxG);
    tone(990,'sine',.12,.45,sfxG,.07);
    tone(1320,'sine',.18,.3,sfxG,.16);
  };

  const die = () => {
    [440,330,261,196].forEach((f,i)=>tone(f,'sawtooth',.35,.3,sfxG,i*.13));
  };

  const start = () => {
    [262,330,392,523].forEach((f,i)=>tone(f,'sine',.22,.4,sfxG,i*.09));
  };

  // Background music scheduler
  const melody=[
    [330,.15],[392,.15],[440,.15],[494,.15],[523,.3],[494,.15],[440,.15],
    [392,.3],[330,.15],[349,.15],[392,.3],[440,.15],[494,.15],
    [440,.3],[392,.15],[330,.3],[294,.15],[262,.3],
  ];
  const bass=[
    [98,.6],[110,.6],[98,.6],[110,.6],
    [87,.6],[98,.6],[87,.6],[98,.6],
  ];

  const schedMus = () => {
    if(!musPlaying||!ac) return;
    let mt=ac.currentTime, bt=ac.currentTime;
    melody.forEach(([f,d])=>{
      try{
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='triangle'; o.frequency.value=f;
        o.connect(g); g.connect(musG);
        g.gain.setValueAtTime(.45,mt);
        g.gain.exponentialRampToValueAtTime(.001,mt+d*.88);
        o.start(mt); o.stop(mt+d); mt+=d;
      }catch(e){}
    });
    bass.forEach(([f,d])=>{
      try{
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='sine'; o.frequency.value=f;
        o.connect(g); g.connect(musG);
        g.gain.setValueAtTime(.3,bt);
        g.gain.exponentialRampToValueAtTime(.001,bt+d*.92);
        o.start(bt); o.stop(bt+d); bt+=d;
      }catch(e){}
    });
    const total = melody.reduce((s,[,d])=>s+d,0);
    musTimer = setTimeout(schedMus, (total-.18)*1000);
  };

  const startMusic = () => {
    if(musPlaying) return;
    musPlaying=true; schedMus();
  };

  const stopMusic = () => {
    musPlaying=false;
    clearTimeout(musTimer);
  };

  return {init,resume,setEnabled,eat,die,start,startMusic,stopMusic,
    get enabled(){return enabled}};
})();

// ═══════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════
const ST = {MENU:0,PLAYING:1,PAUSED:2,GAMEOVER:3};
let state = ST.MENU;

let snake=[], dir={x:1,y:0}, nextDir={x:1,y:0};
let food={x:0,y:0}, score=0, speed=C.initSpeed, moveAcc=0;
let highScore = +localStorage.getItem('lsnHS')||0;
let lastTs=0;

// Camera (smooth float)
let camX=15, camY=15, camTX=15, camTY=15;

// Quotes cycling
let qPool=[], qIdx=0;

// Menu animation
let menuT=0;
let menuSnake=[];
let menuDir={x:1,y:0};
let menuMoveAcc=0;
let menuFood={x:20,y:16};
let menuParticles=[];

// ═══════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

const resize=()=>{ canvas.width=window.innerWidth; canvas.height=window.innerHeight; };
window.addEventListener('resize',resize);
resize();

// ═══════════════════════════════════════════════════════
// ISO MATH
// ═══════════════════════════════════════════════════════
const isoPos=(gx,gy)=>({
  x: (gx-gy)*(C.tileW/2),
  y: (gx+gy)*(C.tileH/2)
});

const worldToScreen=(gx,gy)=>{
  const p=isoPos(gx,gy), cam=isoPos(camX,camY);
  return {x: canvas.width/2+p.x-cam.x, y: canvas.height/2+p.y-cam.y};
};

// ═══════════════════════════════════════════════════════
// DRAWING PRIMITIVES
// ═══════════════════════════════════════════════════════
function drawTileTop(sx,sy,fill,stroke){
  const hw=C.tileW/2, hh=C.tileH/2;
  ctx.beginPath();
  ctx.moveTo(sx,sy-hh);ctx.lineTo(sx+hw,sy);
  ctx.lineTo(sx,sy+hh);ctx.lineTo(sx-hw,sy);
  ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke();}
}

function drawCube(sx,sy,h,tc,lc,rc,stroke){
  const hw=C.tileW/2, hh=C.tileH/2;
  // right face
  ctx.beginPath();
  ctx.moveTo(sx+hw,sy); ctx.lineTo(sx+hw,sy+h);
  ctx.lineTo(sx,sy+hh+h); ctx.lineTo(sx,sy+hh);
  ctx.closePath(); ctx.fillStyle=rc; ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke();}
  // left face
  ctx.beginPath();
  ctx.moveTo(sx-hw,sy); ctx.lineTo(sx-hw,sy+h);
  ctx.lineTo(sx,sy+hh+h); ctx.lineTo(sx,sy+hh);
  ctx.closePath(); ctx.fillStyle=lc; ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke();}
  // top face
  ctx.beginPath();
  ctx.moveTo(sx,sy-hh); ctx.lineTo(sx+hw,sy);
  ctx.lineTo(sx,sy+hh); ctx.lineTo(sx-hw,sy);
  ctx.closePath(); ctx.fillStyle=tc; ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke();}
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawLinkedIn(sx,sy,sz=34){
  const x=sx-sz/2, y=sy-C.wallH-sz-2;
  // shadow
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath();
  ctx.ellipse(sx,sy+C.tileH/2,sz*.55,7,0,0,Math.PI*2);
  ctx.fill();
  // glow
  ctx.shadowColor='#0aa3e0'; ctx.shadowBlur=18;
  ctx.fillStyle='#0077B5';
  rr(x,y,sz,sz,7); ctx.fill();
  ctx.shadowBlur=0;
  // inner highlight
  ctx.fillStyle='rgba(255,255,255,.15)';
  rr(x+2,y+2,sz-4,sz/2-2,5); ctx.fill();
  // "in" text
  ctx.fillStyle='#fff';
  ctx.font=`900 ${sz*.48}px Arial Black,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('in',sx,y+sz/2+1);
  ctx.restore();
}

function drawSnakeEyes(sx,sy,h,d){
  const hw=C.tileW/2, hh=C.tileH/2;
  let e1,e2;
  if(d.x===1){
    e1={x:sx+hw*.38,y:sy-hh*.25-h};
    e2={x:sx+hw*.38,y:sy+hh*.15-h};
  } else if(d.x===-1){
    e1={x:sx-hw*.38,y:sy-hh*.25-h};
    e2={x:sx-hw*.38,y:sy+hh*.15-h};
  } else if(d.y===-1){
    e1={x:sx-hw*.22,y:sy-hh*.6-h};
    e2={x:sx+hw*.22,y:sy-hh*.6-h};
  } else {
    e1={x:sx-hw*.22,y:sy+hh*.2-h};
    e2={x:sx+hw*.22,y:sy+hh*.2-h};
  }
  ctx.fillStyle='#fff';
  [e1,e2].forEach(e=>{ctx.beginPath();ctx.arc(e.x,e.y,3.2,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle='#111';
  [e1,e2].forEach(e=>{ctx.beginPath();ctx.arc(e.x,e.y,1.6,0,Math.PI*2);ctx.fill();});
}

// ═══════════════════════════════════════════════════════
// RENDER GRID (general - works for menu demo & gameplay)
// ═══════════════════════════════════════════════════════
function renderScene(snk, fd, cam, opts={}){
  const {forMenu=false}=opts;
  const gW=C.gridW, gH=C.gridH;
  const snakeSet = new Set(snk.map(s=>`${s.x},${s.y}`));

  // Visible tile range
  const vr=18;
  const x0=Math.max(0,Math.floor(cam.x-vr)), x1=Math.min(gW-1,Math.ceil(cam.x+vr));
  const y0=Math.max(0,Math.floor(cam.y-vr)), y1=Math.min(gH-1,Math.ceil(cam.y+vr));

  // Collect tiles and sort back-to-front
  const tiles=[];
  for(let gy=y0;gy<=y1;gy++) for(let gx=x0;gx<=x1;gx++) tiles.push({gx,gy});
  tiles.sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy));

  const camP=isoPos(cam.x,cam.y);
  const cx2=canvas.width/2, cy2=canvas.height/2;

  tiles.forEach(({gx,gy})=>{
    const p=isoPos(gx,gy);
    const sx=cx2+p.x-camP.x, sy=cy2+p.y-camP.y;
    const isWall=gx===0||gy===0||gx===gW-1||gy===gH-1;
    const idx=snk.findIndex(s=>s.x===gx&&s.y===gy);
    const isFood=fd.x===gx&&fd.y===gy;
    const chk=(gx+gy)%2;

    if(isWall){
      // Wall cube
      drawCube(sx,sy,C.wallH+12,'#1e1742','#130f2e','#1a1438','rgba(162,126,191,.18)');
    } else {
      // Ground tile
      const tileC = chk ? '#1c3528' : '#1a2e24';
      drawTileTop(sx,sy,tileC,'rgba(0,0,0,.12)');

      // Snake segment
      if(idx>=0){
        const isHead=idx===0;
        const t=snk.length>1?idx/(snk.length-1):0;
        let tc,lc,rc;
        if(isHead){
          tc=C.yellow; lc='#b88710'; rc='#d9a018';
        } else {
          const r=Math.round(108-t*35), g2=Math.round(174-t*55), b=Math.round(123-t*45);
          tc=`rgb(${r},${g2},${b})`;
          lc=`rgb(${Math.round(r*.68)},${Math.round(g2*.68)},${Math.round(b*.68)})`;
          rc=`rgb(${Math.round(r*.82)},${Math.round(g2*.82)},${Math.round(b*.82)})`;
        }
        const h=isHead?C.wallH+8:C.wallH;
        drawCube(sx,sy,h,tc,lc,rc,'rgba(0,0,0,.18)');
        if(isHead && !forMenu) drawSnakeEyes(sx,sy,h,dir);
        if(isHead && forMenu) drawSnakeEyes(sx,sy,h,menuDir);
      }

      // Food
      if(isFood){
        const bounce=Math.sin(performance.now()*.0033)*5;
        drawLinkedIn(sx,sy-bounce);
      }
    }
  });
}

// ═══════════════════════════════════════════════════════
// MENU ANIMATION
// ═══════════════════════════════════════════════════════
function initMenuSnake(){
  const cx=Math.floor(C.gridW/2), cy=Math.floor(C.gridH/2);
  menuSnake=[];
  for(let i=0;i<6;i++) menuSnake.push({x:cx-i,y:cy});
  menuDir={x:1,y:0};
  menuFood={x:cx+5,y:cy};
  menuMoveAcc=0;
}

function updateMenuSnake(dt){
  menuMoveAcc+=dt;
  if(menuMoveAcc<320) return;
  menuMoveAcc=0;

  const head=menuSnake[0];
  // Simple AI: chase food, avoid walls
  const dx=menuFood.x-head.x, dy=menuFood.y-head.y;
  const opts=[];
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(([ex,ey])=>{
    if(ex===-menuDir.x&&ey===-menuDir.y) return;
    const nx=head.x+ex, ny=head.y+ey;
    if(nx<1||ny<1||nx>=C.gridW-1||ny>=C.gridH-1) return;
    if(menuSnake.some(s=>s.x===nx&&s.y===ny)) return;
    const dist=Math.abs(menuFood.x-nx)+Math.abs(menuFood.y-ny);
    opts.push({ex,ey,dist});
  });
  if(opts.length){
    opts.sort((a,b)=>a.dist-b.dist);
    menuDir={x:opts[0].ex,y:opts[0].ey};
  }
  const newHead={x:head.x+menuDir.x,y:head.y+menuDir.y};
  if(newHead.x<1||newHead.y<1||newHead.x>=C.gridW-1||newHead.y>=C.gridH-1){
    initMenuSnake(); return;
  }
  menuSnake.unshift(newHead);
  if(newHead.x===menuFood.x&&newHead.y===menuFood.y){
    // New food
    let fx,fy,att=0;
    do {
      fx=Math.floor(Math.random()*(C.gridW-4))+2;
      fy=Math.floor(Math.random()*(C.gridH-4))+2;
      att++;
    } while(menuSnake.some(s=>s.x===fx&&s.y===fy)&&att<80);
    menuFood={x:fx,y:fy};
  } else {
    menuSnake.pop();
  }
}

// ═══════════════════════════════════════════════════════
// POPUPS
// ═══════════════════════════════════════════════════════
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function nextQuote(){
  if(qIdx>=qPool.length){qPool=shuffle([...QUOTES]);qIdx=0;}
  return qPool[qIdx++];
}

function spawnPopup(gx,gy){
  const text=nextQuote();
  // Calculate screen position NOW (before camera moves)
  const camP=isoPos(camX,camY);
  const p=isoPos(gx,gy);
  const sx=canvas.width/2+p.x-camP.x;
  const sy=canvas.height/2+p.y-camP.y-C.wallH-18;

  const el=document.createElement('div');
  el.className='popup';
  el.textContent=text;

  // Clamp to screen
  const maxW=Math.min(260,window.innerWidth*.66);
  const px=Math.max(10,Math.min(sx-maxW/2, window.innerWidth-maxW-10));
  const py=Math.max(54,Math.min(sy-16, window.innerHeight-110));

  el.style.cssText=`left:${px}px;top:${py}px;max-width:${maxW}px`;
  document.getElementById('popupLayer').appendChild(el);
  setTimeout(()=>el.remove(),3100);
}

// ═══════════════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════════════
const particles=[];
function spawnParticles(sx,sy){
  for(let i=0;i<10;i++){
    const angle=Math.random()*Math.PI*2;
    const spd=2+Math.random()*4;
    particles.push({
      x:sx,y:sy,
      vx:Math.cos(angle)*spd,
      vy:Math.sin(angle)*spd-3,
      life:1,
      color:[C.yellow,C.purple,C.green,'#0077B5'][Math.floor(Math.random()*4)],
      size:3+Math.random()*4
    });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=.18; p.life-=dt/900;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;
}

// ═══════════════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════════════
function placeFood(){
  let fx,fy,att=0;
  do{
    fx=Math.floor(Math.random()*(C.gridW-4))+2;
    fy=Math.floor(Math.random()*(C.gridH-4))+2;
    att++;
  }while(snake.some(s=>s.x===fx&&s.y===fy)&&att<200);
  food={x:fx,y:fy};
}

function moveSnake(){
  dir={...nextDir};
  const head=snake[0];
  const nh={x:head.x+dir.x,y:head.y+dir.y};

  // Wall hit
  if(nh.x<0||nh.y<0||nh.x>=C.gridW||nh.y>=C.gridH){
    doGameOver(); return;
  }
  // Self hit (skip neck segment to avoid false positive on quick turns)
  if(snake.some((s,i)=>i>0&&s.x===nh.x&&s.y===nh.y)){
    doGameOver(); return;
  }

  snake.unshift(nh);

  if(nh.x===food.x&&nh.y===food.y){
    score++;
    if(score>highScore){highScore=score;localStorage.setItem('lsnHS',highScore);}
    document.getElementById('scoreVal').textContent=score;
    document.getElementById('levelVal').textContent='Nivå '+(Math.floor(score/5)+1);
    speed=Math.max(C.minSpeed,C.initSpeed-score*C.speedStep);

    // Screen pos for popup
    const camP=isoPos(camX,camY);
    const fp=isoPos(food.x,food.y);
    const fsx=canvas.width/2+fp.x-camP.x;
    const fsy=canvas.height/2+fp.y-camP.y;
    spawnPopup(food.x,food.y);
    spawnParticles(fsx,fsy-C.wallH-20);
    Audio.eat();
    placeFood();
  } else {
    snake.pop();
  }

  camTX=snake[0].x; camTY=snake[0].y;
}

function doGameOver(){
  Audio.stopMusic(); Audio.die();
  setState(ST.GAMEOVER);
  document.getElementById('finalScore').textContent=score;
  document.getElementById('goHs').innerHTML='Rekord: <strong>'+highScore+'</strong>';
}

// ═══════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════
function setDir(d){
  if(state!==ST.PLAYING) return;
  if(d.x===-dir.x&&d.y===-dir.y) return;
  if(d.x===-nextDir.x&&d.y===-nextDir.y) return;
  nextDir=d;
}

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowUp'||k==='w'||k==='W')    setDir({x:0,y:-1});
  if(k==='ArrowDown'||k==='s'||k==='S')  setDir({x:0,y:1});
  if(k==='ArrowLeft'||k==='a'||k==='A')  setDir({x:-1,y:0});
  if(k==='ArrowRight'||k==='d'||k==='D') setDir({x:1,y:0});
  if((k==='Escape'||k==='p'||k==='P')){
    if(state===ST.PLAYING) togglePause();
    else if(state===ST.PAUSED) resumeGame();
  }
});

let tx0=0,ty0=0;
document.addEventListener('touchstart',e=>{
  e.preventDefault();
  tx0=e.touches[0].clientX; ty0=e.touches[0].clientY;
},{passive:false});
document.addEventListener('touchend',e=>{
  e.preventDefault();
  const dx=e.changedTouches[0].clientX-tx0;
  const dy=e.changedTouches[0].clientY-ty0;
  if(Math.max(Math.abs(dx),Math.abs(dy))<18) return;
  if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?{x:1,y:0}:{x:-1,y:0});
  else setDir(dy>0?{x:0,y:1}:{x:0,y:-1});
  if(state===ST.PAUSED) resumeGame();
},{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ═══════════════════════════════════════════════════════
// STATE MANAGEMENT
// ═══════════════════════════════════════════════════════
function setState(s){
  state=s;
  document.getElementById('menuScreen').classList.toggle('hidden',s!==ST.MENU);
  document.getElementById('pauseScreen').classList.toggle('hidden',s!==ST.PAUSED);
  document.getElementById('gameOverScreen').classList.toggle('hidden',s!==ST.GAMEOVER);
  document.getElementById('hud').classList.toggle('hidden',s===ST.MENU||s===ST.GAMEOVER);
  document.getElementById('sfxBtn').classList.toggle('hidden',s===ST.MENU);
}

function startGame(){
  Audio.init(); Audio.resume();
  const cx=Math.floor(C.gridW/2), cy=Math.floor(C.gridH/2);
  snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; speed=C.initSpeed; moveAcc=0;
  camX=cx; camY=cy; camTX=cx; camTY=cy;
  qPool=shuffle([...QUOTES]); qIdx=0;
  document.getElementById('scoreVal').textContent='0';
  document.getElementById('levelVal').textContent='Nivå 1';
  document.getElementById('popupLayer').innerHTML='';
  particles.length=0;
  placeFood();
  setState(ST.PLAYING);
  Audio.startMusic(); Audio.start();
  lastTs=0;
}

function togglePause(){
  if(state===ST.PLAYING){ Audio.stopMusic(); setState(ST.PAUSED); }
}
function resumeGame(){
  if(state===ST.PAUSED){ setState(ST.PLAYING); Audio.startMusic(); lastTs=0; }
}
function goToMenu(){
  Audio.stopMusic();
  setState(ST.MENU);
  document.getElementById('popupLayer').innerHTML='';
  particles.length=0;
  document.getElementById('menuHs').innerHTML='Rekord: <strong>'+highScore+'</strong>';
}
function toggleSound(){
  Audio.init();
  const on=!Audio.enabled;
  Audio.setEnabled(on);
  const icon=on?'🔊':'🔇';
  document.getElementById('sfxBtn').textContent=icon;
  document.getElementById('menuSfxBtn').textContent=icon+' Lyd '+(on?'på':'av');
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
function renderBG(){
  const g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  g.addColorStop(0,'#0d0920');
  g.addColorStop(.5,'#161130');
  g.addColorStop(1,'#0f1d14');
  ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
}

function renderMenuBG(dt){
  renderBG();
  // Ambient dots
  ctx.fillStyle='rgba(162,126,191,.1)';
  for(let x=0;x<canvas.width;x+=36){
    for(let y=0;y<canvas.height;y+=36){
      ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fill();
    }
  }
  updateMenuSnake(dt);
  const mcam={x:menuSnake[0]?.x||15, y:menuSnake[0]?.y||15};
  // Smooth menu cam
  renderScene(menuSnake,menuFood,mcam,{forMenu:true});
}

// ═══════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════
function loop(ts){
  const dt=Math.min(ts-(lastTs||ts),100);
  lastTs=ts;

  if(state===ST.PLAYING){
    // Camera smooth follow
    const lp=.13;
    camX+=(camTX-camX)*lp; camY+=(camTY-camY)*lp;
    // Move snake
    moveAcc+=dt;
    if(moveAcc>=speed){ moveAcc-=speed; moveSnake(); }
    // Render
    renderBG();
    renderScene(snake,food,{x:camX,y:camY});
    updateParticles(dt); drawParticles();
  } else if(state===ST.PAUSED){
    renderBG();
    renderScene(snake,food,{x:camX,y:camY});
  } else {
    renderMenuBG(dt);
  }

  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════
initMenuSnake();
document.getElementById('menuHs').innerHTML='Rekord: <strong>'+highScore+'</strong>';
setState(ST.MENU);
requestAnimationFrame(loop);
</script>
