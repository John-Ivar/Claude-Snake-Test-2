<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#20183C">
<title>LinkedIn Snake 🐍</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0920;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:10;
  transition:opacity .3s ease,visibility .3s ease}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
#menuScreen{background:linear-gradient(160deg,#0a0618 0%,#15102e 55%,#0e1a10 100%)}
.menu-logo{animation:floatBob 2.8s ease-in-out infinite;margin-bottom:20px;filter:drop-shadow(0 0 24px rgba(0,119,181,.7))}
@keyframes floatBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.game-title{font-size:clamp(2.2rem,9vw,4.5rem);font-weight:900;color:#F8B725;
  letter-spacing:-3px;line-height:.95;text-align:center;
  text-shadow:0 0 40px rgba(248,183,37,.5),0 4px 20px rgba(0,0,0,.5)}
.game-sub{font-size:clamp(.75rem,2.5vw,1rem);color:#FFF1CB;opacity:.6;margin-top:10px;text-align:center}
.menu-btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 40px;border-radius:50px;font-size:1rem;font-weight:700;cursor:pointer;
  border:none;min-width:210px;transition:transform .15s,box-shadow .15s,background .15s;letter-spacing:.3px}
.btn:active{transform:scale(.96)!important}
.btn-primary{background:#F8B725;color:#20183C;box-shadow:0 4px 28px rgba(248,183,37,.45)}
.btn-primary:hover{box-shadow:0 8px 36px rgba(248,183,37,.65);transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.06);color:#FFF1CB;border:1.5px solid rgba(255,241,203,.25);backdrop-filter:blur(8px)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.menu-hs{color:rgba(255,241,203,.45);font-size:.85rem;margin-top:20px}
.menu-hs strong{color:#F8B725}
.menu-hint{color:rgba(255,241,203,.3);font-size:.72rem;margin-top:14px;text-align:center;line-height:1.8}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:center;padding:14px 18px;z-index:20;pointer-events:none;
  transition:opacity .3s,visibility .3s}
#hud.hidden{opacity:0;visibility:hidden}
.hud-pill{background:rgba(10,6,28,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:50px;padding:8px 18px;border:1px solid rgba(255,255,255,.1);pointer-events:all}
.hud-score{color:#F8B725;font-size:1.3rem;font-weight:800}
.hud-level{color:#A27EBF;font-size:.8rem;font-weight:600}
.hud-pausebtn{color:#FFF1CB;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s}
.hud-pausebtn:hover{background:rgba(255,255,255,.1)}
#pauseScreen{background:rgba(8,5,22,.9);backdrop-filter:blur(28px)}
.overlay-title{font-size:clamp(2rem,7vw,3.2rem);font-weight:900;margin-bottom:30px}
#gameOverScreen{background:rgba(8,5,22,.92);backdrop-filter:blur(28px)}
.go-title{font-size:clamp(2rem,7vw,3rem);font-weight:900;color:#e1582e;margin-bottom:6px;
  text-shadow:0 0 30px rgba(225,88,46,.5)}
.go-score{font-size:1rem;color:rgba(255,241,203,.7);margin-bottom:8px}
.go-score span{color:#F8B725;font-size:2.2rem;font-weight:900;display:block;margin-top:4px;
  text-shadow:0 0 20px rgba(248,183,37,.4)}
.go-hs{font-size:.82rem;color:rgba(255,241,203,.4);margin-bottom:28px}
.go-hs strong{color:#A27EBF}
#popupLayer{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.popup{position:absolute;background:#fff;border-radius:12px;padding:10px 15px;
  font-size:clamp(.68rem,2.2vw,.88rem);font-weight:600;color:#20183C;
  box-shadow:0 8px 32px rgba(0,0,0,.3);max-width:min(260px,66vw);
  word-wrap:break-word;text-align:center;border-left:4px solid #0077B5;
  line-height:1.5;white-space:normal;
  animation:popAnim 3s cubic-bezier(.4,0,.2,1) forwards}
@keyframes popAnim{
  0%{opacity:0;transform:scale(.5) translateY(10px)}
  14%{opacity:1;transform:scale(1.06) translateY(-8px)}
  22%{transform:scale(1) translateY(-14px)}
  68%{opacity:1;transform:scale(1) translateY(-26px)}
  100%{opacity:0;transform:scale(.88) translateY(-52px)}}
#sfxBtn{position:fixed;bottom:18px;right:18px;z-index:25;width:42px;height:42px;
  border-radius:50%;border:1px solid rgba(255,255,255,.15);
  background:rgba(10,6,28,.85);backdrop-filter:blur(12px);
  color:#FFF1CB;font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:opacity .3s,visibility .3s}
#sfxBtn.hidden{opacity:0;visibility:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="hud-pill hud-score">🐍 <span id="scoreVal">0</span></div>
  <div class="hud-pill hud-level" id="levelVal">Nivå 1</div>
  <div class="hud-pill hud-pausebtn" onclick="togglePause()">⏸ Pause</div>
</div>

<div id="menuScreen" class="screen">
  <svg class="menu-logo" width="76" height="76" viewBox="0 0 76 76"><rect width="76" height="76" rx="14" fill="#0077B5"/><text x="38" y="53" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="38" fill="white">in</text></svg>
  <h1 class="game-title">LinkedIn<br>Snake</h1>
  <p class="game-sub">Det norske næringslivets favorittspill</p>
  <div class="menu-btns">
    <button class="btn btn-primary" onclick="startGame()">🚀 Spill nå</button>
    <button class="btn btn-ghost" id="menuSfxBtn" onclick="toggleSound()">🔊 Lyd på</button>
  </div>
  <div class="menu-hs" id="menuHs">Rekord: <strong>0</strong></div>
  <p class="menu-hint">Piltaster / WASD på PC &nbsp;·&nbsp; Sveip på mobil<br>ESC eller P for pause</p>
</div>

<div id="pauseScreen" class="screen hidden">
  <div class="overlay-title" style="color:#F8B725">⏸ Pause</div>
  <div class="menu-btns">
    <button class="btn btn-primary" onclick="resumeGame()">▶ Fortsett</button>
    <button class="btn btn-ghost" onclick="goToMenu()">🏠 Tilbake til meny</button>
  </div>
</div>

<div id="gameOverScreen" class="screen hidden">
  <div class="go-title">💼 Game Over</div>
  <div class="go-score">Du spiste <span id="finalScore">0</span> LinkedIn-innlegg</div>
  <div class="go-hs" id="goHs">Rekord: <strong>0</strong></div>
  <div class="menu-btns">
    <button class="btn btn-primary" onclick="startGame()">🔄 Prøv igjen</button>
    <button class="btn btn-ghost" onclick="goToMenu()">🏠 Meny</button>
  </div>
</div>

<div id="popupLayer"></div>
<button id="sfxBtn" class="hidden" onclick="toggleSound()">🔊</button>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const C = {
  yellow:'#F8B725', purple:'#A27EBF', red:'#e1582e',
  dark:'#20183C', green:'#6CAE7B', cream:'#FFF1CB',
  linkedin:'#0077B5',
  tileW:64, tileH:32,
  gridW:32, gridH:32,
  initSpeed:195, minSpeed:82, speedStep:4,
  wallH:40,
};

const QUOTES = [
  '"Stolt & ydmyk"','Takk for at du deler!','Dette er såå sant',
  'Endelig kan jeg dele...','🚀🚀🚀','Faglig påfyll','Tankeleder',
  'AI forandrer måten vi jobber på','Arendalsuka – vi sees!',
  'Jeg er klar for nye eventyr! 👋','Jeg er klar for nye utfordringer',
  'Gleder meg til å ta fatt på nye utfordringer',
  'Kommentarer gir mer rekkevidde','Podcast ute nå',
  'Brenner for [generisk norsk tema]','Fredagspåfyll ☕️',
  'Tverrfaglig team','Lavthengende frukter','Paradigmeskifte',
  'Takk for en spennende workshop','Utrolig takknemlig','Synergi i praksis',
  'KI-strategi','La oss være ærlige','Gratulerer med ny jobb 🎉',
  'Jeg bruker faktisk tankestrek ofte','Foto: Øyvind Ganesh',
  'Din personlige merkevare','Jeg starter nå for meg selv',
  'LinkedIn er en circle jerk','LinkedIn-eliten bestemmer over deg',
  'For mye positivitet på LinkedIn','Lag den feeden du ønsker selv',
  'Hjelper ledere å kommunisere bedre','Hjelper deg å skinne i sosiale medier',
  'Heier på dette!','Hjelper deg å vokse på LinkedIn',
  'Kommenter JA for å få oppskriften min','Kommenter SNAKE for å få oppskriften min',
  'Forrige uke holdt jeg foredrag hos [norsk selskap]',
  'Hva er dine beste tips for å lykkes?',
  'Hva mener du? Kommenter under','Kjør debatt!','Neida. Joda.','Fin post.',
  'Vær deg selv','Jeg har betalt 10k for dette. Nå gir jeg det ut gratis.',
  'Hva tror du? 💭','Noen ting er viktigere enn andre. Dette er det.'
];

// ═══════════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════════
const Audio = (() => {
  let ac=null, master=null, sfxG=null, musG=null;
  let enabled=true, musPlaying=false, musTimer=null;
  const init = () => {
    if(ac) return;
    try {
      ac = new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=1; master.connect(ac.destination);
      sfxG=ac.createGain(); sfxG.gain.value=0.55; sfxG.connect(master);
      musG=ac.createGain(); musG.gain.value=0.18; musG.connect(master);
    } catch(e){}
  };
  const resume=()=>ac&&ac.state==='suspended'&&ac.resume();
  const tone=(freq,type,dur,vol,dest,delay=0)=>{
    if(!ac||!enabled) return;
    try {
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=type; o.frequency.value=freq; o.connect(g); g.connect(dest);
      const t=ac.currentTime+delay;
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.start(t); o.stop(t+dur+.01);
    } catch(e){}
  };
  const setEnabled=(v)=>{enabled=v; if(master) master.gain.value=v?1:0; if(v) resume();};
  const eat=()=>{ tone(660,'sine',.08,.6,sfxG); tone(990,'sine',.12,.45,sfxG,.07); tone(1320,'sine',.18,.3,sfxG,.16); };
  const die=()=>{ [440,330,261,196].forEach((f,i)=>tone(f,'sawtooth',.35,.3,sfxG,i*.13)); };
  const start=()=>{ [262,330,392,523].forEach((f,i)=>tone(f,'sine',.22,.4,sfxG,i*.09)); };
  const melody=[[330,.15],[392,.15],[440,.15],[494,.15],[523,.3],[494,.15],[440,.15],[392,.3],[330,.15],[349,.15],[392,.3],[440,.15],[494,.15],[440,.3],[392,.15],[330,.3],[294,.15],[262,.3]];
  const bass=[[98,.6],[110,.6],[98,.6],[110,.6],[87,.6],[98,.6],[87,.6],[98,.6]];
  const schedMus=()=>{
    if(!musPlaying||!ac) return;
    let mt=ac.currentTime, bt=ac.currentTime;
    melody.forEach(([f,d])=>{ try{const o=ac.createOscillator(),g=ac.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(musG); g.gain.setValueAtTime(.45,mt); g.gain.exponentialRampToValueAtTime(.001,mt+d*.88); o.start(mt); o.stop(mt+d); mt+=d;}catch(e){} });
    bass.forEach(([f,d])=>{ try{const o=ac.createOscillator(),g=ac.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(musG); g.gain.setValueAtTime(.3,bt); g.gain.exponentialRampToValueAtTime(.001,bt+d*.92); o.start(bt); o.stop(bt+d); bt+=d;}catch(e){} });
    const total=melody.reduce((s,[,d])=>s+d,0);
    musTimer=setTimeout(schedMus,(total-.18)*1000);
  };
  const startMusic=()=>{ if(musPlaying) return; musPlaying=true; schedMus(); };
  const stopMusic=()=>{ musPlaying=false; clearTimeout(musTimer); };
  return {init,resume,setEnabled,eat,die,start,startMusic,stopMusic, get enabled(){return enabled}};
})();

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
const ST={MENU:0,PLAYING:1,PAUSED:2,GAMEOVER:3};
let state=ST.MENU;
let snake=[],dir={x:1,y:0},nextDir={x:1,y:0};
let food={x:0,y:0},score=0,speed=C.initSpeed,moveAcc=0;
let highScore=+localStorage.getItem('lsnHS')||0;
let lastTs=0;
let camX=15,camY=15,camTX=15,camTY=15;
let qPool=[],qIdx=0;
let menuSnake=[],menuDir={x:1,y:0},menuMoveAcc=0,menuFood={x:20,y:16};
let tongueTimer=0,tongueSide=1;

// ═══════════════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════════════
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const resize=()=>{ canvas.width=window.innerWidth; canvas.height=window.innerHeight; };
window.addEventListener('resize',resize); resize();

// ═══════════════════════════════════════════════════════════════
// ISO MATH
// ═══════════════════════════════════════════════════════════════
const isoPos=(gx,gy)=>({ x:(gx-gy)*(C.tileW/2), y:(gx+gy)*(C.tileH/2) });

// ═══════════════════════════════════════════════════════════════
// DRAWING — TILES
// ═══════════════════════════════════════════════════════════════
function drawGroundTile(sx,sy,chk){
  const hw=C.tileW/2, hh=C.tileH/2;
  // Main fill
  ctx.beginPath();
  ctx.moveTo(sx,sy-hh); ctx.lineTo(sx+hw,sy); ctx.lineTo(sx,sy+hh); ctx.lineTo(sx-hw,sy);
  ctx.closePath();
  ctx.fillStyle = chk ? '#306848' : '#285c40';
  ctx.fill();
  // Lit top-left edges
  ctx.strokeStyle='rgba(140,255,160,.1)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx,sy-hh); ctx.lineTo(sx-hw,sy); ctx.stroke();
  ctx.strokeStyle='rgba(100,220,130,.07)';
  ctx.beginPath(); ctx.moveTo(sx,sy-hh); ctx.lineTo(sx+hw,sy); ctx.stroke();
  // Shadow bottom edges
  ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx-hw,sy); ctx.lineTo(sx,sy+hh); ctx.lineTo(sx+hw,sy); ctx.stroke();
}

function drawWallTile(sx,sy){
  const hw=C.tileW/2, hh=C.tileH/2, h=C.wallH;
  // Right face
  let g=ctx.createLinearGradient(sx,sy-hh,sx,sy+h);
  g.addColorStop(0,'#4a3088'); g.addColorStop(1,'#28185a');
  ctx.beginPath();
  ctx.moveTo(sx+hw,sy); ctx.lineTo(sx+hw,sy+h); ctx.lineTo(sx,sy+hh+h); ctx.lineTo(sx,sy+hh);
  ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  // Left face
  g=ctx.createLinearGradient(sx,sy-hh,sx,sy+h);
  g.addColorStop(0,'#38256e'); g.addColorStop(1,'#1c1044');
  ctx.beginPath();
  ctx.moveTo(sx-hw,sy); ctx.lineTo(sx-hw,sy+h); ctx.lineTo(sx,sy+hh+h); ctx.lineTo(sx,sy+hh);
  ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  // Top face
  ctx.beginPath();
  ctx.moveTo(sx,sy-hh); ctx.lineTo(sx+hw,sy); ctx.lineTo(sx,sy+hh); ctx.lineTo(sx-hw,sy);
  ctx.closePath();
  g=ctx.createRadialGradient(sx,sy-hh*.3,0,sx,sy,hw*.9);
  g.addColorStop(0,'#6040a8'); g.addColorStop(1,'#3d2878');
  ctx.fillStyle=g; ctx.fill();
  // Glow edges
  ctx.strokeStyle='rgba(180,140,255,.45)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(sx,sy-hh); ctx.lineTo(sx+hw,sy);
  ctx.moveTo(sx,sy-hh); ctx.lineTo(sx-hw,sy); ctx.stroke();
  ctx.strokeStyle='rgba(140,100,220,.2)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx-hw,sy); ctx.lineTo(sx-hw,sy+h);
  ctx.moveTo(sx+hw,sy); ctx.lineTo(sx+hw,sy+h); ctx.stroke();
}

// ═══════════════════════════════════════════════════════════════
// DRAWING — SNAKE (smooth tube)
// ═══════════════════════════════════════════════════════════════
function getSnakePts(snk, camP, cx2, cy2){
  const ELEV = 16;
  return snk.map(s => {
    const p=isoPos(s.x,s.y);
    return { x: cx2+p.x-camP.x, y: cy2+p.y-camP.y-ELEV };
  });
}

function buildSnakePath(pts, ox=0, oy=0){
  if(!pts.length) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x+ox, pts[0].y+oy);
  if(pts.length===1) return;
  if(pts.length===2){ ctx.lineTo(pts[1].x+ox, pts[1].y+oy); return; }
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i].x+pts[i+1].x)/2+ox;
    const my=(pts[i].y+pts[i+1].y)/2+oy;
    ctx.quadraticCurveTo(pts[i].x+ox, pts[i].y+oy, mx, my);
  }
  ctx.lineTo(pts[pts.length-1].x+ox, pts[pts.length-1].y+oy);
}

function drawSnakeTube(pts){
  if(!pts.length) return;
  const BW=22;
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  // Drop shadow
  ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=BW+10;
  buildSnakePath(pts,3,7); ctx.stroke();
  // Dark outline
  ctx.strokeStyle='rgba(0,20,8,.75)'; ctx.lineWidth=BW+4;
  buildSnakePath(pts); ctx.stroke();
  // Body gradient (head→tail)
  const h=pts[0], t=pts[pts.length-1];
  const grad=ctx.createLinearGradient(h.x,h.y,t.x,t.y);
  grad.addColorStop(0,'#7ee896');
  grad.addColorStop(0.35,'#44c46a');
  grad.addColorStop(0.75,'#28934a');
  grad.addColorStop(1,'#175c2e');
  ctx.strokeStyle=grad; ctx.lineWidth=BW;
  buildSnakePath(pts); ctx.stroke();
  // Scale pattern — subtle dark stripes along body
  ctx.strokeStyle='rgba(0,30,12,.18)'; ctx.lineWidth=BW*.55;
  buildSnakePath(pts); ctx.stroke();
  // Highlight stripe (top-left light reflection)
  ctx.strokeStyle='rgba(255,255,255,.26)'; ctx.lineWidth=BW*.28;
  buildSnakePath(pts,-4,-5); ctx.stroke();
  ctx.restore();
}

function drawSnakeHead(pos, d, now){
  const {x,y}=pos;
  const r=16;
  // Head protrudes slightly in direction of travel
  const hx=x+d.x*5, hy=y+d.y*3;
  ctx.save();
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(hx+2,hy+6,r+5,r+3,0,0,Math.PI*2); ctx.fill();
  // Dark outline
  ctx.fillStyle='rgba(0,20,8,.8)';
  ctx.beginPath(); ctx.arc(hx,hy,r+2.5,0,Math.PI*2); ctx.fill();
  // Head fill — vivid yellow-green
  const hgrad=ctx.createRadialGradient(hx-r*.3,hy-r*.3,0,hx,hy,r);
  hgrad.addColorStop(0,'#a8f040');
  hgrad.addColorStop(0.55,'#72d830');
  hgrad.addColorStop(1,'#44a01a');
  ctx.fillStyle=hgrad;
  ctx.beginPath(); ctx.arc(hx,hy,r,0,Math.PI*2); ctx.fill();
  // Specular highlight
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(hx-r*.28,hy-r*.32,r*.38,r*.24,-0.4,0,Math.PI*2); ctx.fill();
  // Eyes
  let e1,e2;
  const eo=r*.52;
  if(d.x===1)       { e1={x:hx+r*.32,y:hy-eo*.5};  e2={x:hx+r*.32,y:hy+eo*.4}; }
  else if(d.x===-1) { e1={x:hx-r*.32,y:hy-eo*.5};  e2={x:hx-r*.32,y:hy+eo*.4}; }
  else if(d.y===-1) { e1={x:hx-eo*.55,y:hy-r*.35}; e2={x:hx+eo*.55,y:hy-r*.35}; }
  else              { e1={x:hx-eo*.55,y:hy+r*.28};  e2={x:hx+eo*.55,y:hy+r*.28}; }
  const er=r*.27;
  // White sclera
  ctx.fillStyle='#fff';
  [e1,e2].forEach(e=>{ctx.beginPath();ctx.arc(e.x,e.y,er,0,Math.PI*2);ctx.fill();});
  // Pupil
  ctx.fillStyle='#111';
  [e1,e2].forEach(e=>{ctx.beginPath();ctx.arc(e.x+er*.18,e.y+er*.1,er*.6,0,Math.PI*2);ctx.fill();});
  // Eye shine
  ctx.fillStyle='rgba(255,255,255,.9)';
  [e1,e2].forEach(e=>{ctx.beginPath();ctx.arc(e.x-er*.2,e.y-er*.22,er*.28,0,Math.PI*2);ctx.fill();});
  // Tongue — flickers
  const tf=Math.sin(now*.008);
  if(tf>0.3){
    const tl=r*.9+tf*r*.4;
    const tx1=hx+d.x*(r+1), ty1=hy+d.y*(r+1)-1;
    const tx2=hx+d.x*(r+tl), ty2=hy+d.y*(r+tl)-1;
    const px=d.y*r*.28, py=-d.x*r*.28; // perpendicular
    ctx.strokeStyle='#e1582e'; ctx.lineWidth=1.8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(tx1,ty1); ctx.lineTo(tx2,ty2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tx2,ty2); ctx.lineTo(tx2+d.x*r*.32+px,ty2+d.y*r*.32+py); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tx2,ty2); ctx.lineTo(tx2+d.x*r*.32-px,ty2+d.y*r*.32-py); ctx.stroke();
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
// DRAWING — FOOD
// ═══════════════════════════════════════════════════════════════
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function drawLinkedIn(sx,sy,now){
  const pulse=Math.sin(now*.003)*.5+.5;
  const sz=38+pulse*4;
  const x=sx-sz/2, y=sy-20-sz;
  ctx.save();
  // Ground shadow (isometric ellipse under logo)
  ctx.fillStyle='rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(sx,sy,sz*.52,8,0,0,Math.PI*2); ctx.fill();
  // Outer glow ring
  ctx.shadowColor='#0aa8e8'; ctx.shadowBlur=22+pulse*12;
  ctx.fillStyle='rgba(0,120,190,.25)';
  rr(x-4,y-4,sz+8,sz+8,12); ctx.fill();
  ctx.shadowBlur=0;
  // Card background
  ctx.fillStyle='#0077B5';
  rr(x,y,sz,sz,8); ctx.fill();
  // Inner top shine
  ctx.fillStyle='rgba(255,255,255,.18)';
  rr(x+3,y+3,sz-6,sz/2-2,6); ctx.fill();
  // "in" text
  ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=4;
  ctx.fillStyle='#fff';
  ctx.font=`900 ${Math.round(sz*.5)}px Arial Black,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('in',sx,y+sz*.52);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
// RENDER SCENE
// ═══════════════════════════════════════════════════════════════
function renderScene(snk, fd, cam, opts={}){
  const {forMenu=false}=opts;
  const gW=C.gridW, gH=C.gridH;
  const vr=20;
  const x0=Math.max(0,Math.floor(cam.x-vr)), x1=Math.min(gW-1,Math.ceil(cam.x+vr));
  const y0=Math.max(0,Math.floor(cam.y-vr)), y1=Math.min(gH-1,Math.ceil(cam.y+vr));
  const camP=isoPos(cam.x,cam.y);
  const cx2=canvas.width/2, cy2=canvas.height/2;
  const now=performance.now();

  // Collect + sort back-to-front
  const tiles=[];
  for(let gy=y0;gy<=y1;gy++) for(let gx=x0;gx<=x1;gx++) tiles.push({gx,gy});
  tiles.sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy));

  // Pass 1: ground + walls
  tiles.forEach(({gx,gy})=>{
    const p=isoPos(gx,gy);
    const sx=cx2+p.x-camP.x, sy=cy2+p.y-camP.y;
    const isWall=gx===0||gy===0||gx===gW-1||gy===gH-1;
    if(isWall) drawWallTile(sx,sy);
    else drawGroundTile(sx,sy,(gx+gy)%2);
  });

  // Pass 2: food (float above ground)
  {
    const fp=isoPos(fd.x,fd.y);
    const fsx=cx2+fp.x-camP.x, fsy=cy2+fp.y-camP.y;
    const bounce=Math.sin(now*.0035)*6;
    drawLinkedIn(fsx, fsy-bounce, now);
  }

  // Pass 3: snake as smooth tube
  const pts=getSnakePts(snk, camP, cx2, cy2);
  if(pts.length>1) drawSnakeTube(pts);
  if(pts.length>=1){
    const snkDir=forMenu?menuDir:dir;
    drawSnakeHead(pts[0], snkDir, now);
  }
}

// ═══════════════════════════════════════════════════════════════
// BACKGROUND
// ═══════════════════════════════════════════════════════════════
function renderBG(){
  // Base gradient
  const g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  g.addColorStop(0,'#080518');
  g.addColorStop(.45,'#0e0c22');
  g.addColorStop(1,'#080f0a');
  ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
  // Atmospheric radial glow in center
  const rg=ctx.createRadialGradient(canvas.width/2,canvas.height/2,0,canvas.width/2,canvas.height/2,canvas.width*.55);
  rg.addColorStop(0,'rgba(30,80,50,.18)');
  rg.addColorStop(0.5,'rgba(20,40,80,.1)');
  rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,canvas.width,canvas.height);
}

function renderMenuBG(dt){
  renderBG();
  // Ambient dot grid
  ctx.fillStyle='rgba(140,100,200,.09)';
  for(let x=0;x<canvas.width;x+=40)
    for(let y=0;y<canvas.height;y+=40){
      ctx.beginPath(); ctx.arc(x,y,1.3,0,Math.PI*2); ctx.fill();
    }
  updateMenuSnake(dt);
  const mcam={x:menuSnake[0]?.x||15, y:menuSnake[0]?.y||15};
  renderScene(menuSnake, menuFood, mcam, {forMenu:true});
}

// ═══════════════════════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════════════════════
const particles=[];
function spawnParticles(sx,sy){
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, spd=2.5+Math.random()*5;
    particles.push({
      x:sx, y:sy, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-2.5,
      life:1, decay:.012+Math.random()*.01,
      color:['#F8B725','#A27EBF','#6CAE7B','#0abaff','#e1582e'][Math.floor(Math.random()*5)],
      size:4+Math.random()*5
    });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.2; p.life-=dt*p.decay;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life*p.life);
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

// ═══════════════════════════════════════════════════════════════
// MENU SNAKE AI
// ═══════════════════════════════════════════════════════════════
function initMenuSnake(){
  const cx=Math.floor(C.gridW/2), cy=Math.floor(C.gridH/2);
  menuSnake=[];
  for(let i=0;i<8;i++) menuSnake.push({x:cx-i,y:cy});
  menuDir={x:1,y:0}; menuFood={x:cx+6,y:cy}; menuMoveAcc=0;
}
function updateMenuSnake(dt){
  menuMoveAcc+=dt;
  if(menuMoveAcc<310) return;
  menuMoveAcc=0;
  const head=menuSnake[0];
  const opts=[];
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(([ex,ey])=>{
    if(ex===-menuDir.x&&ey===-menuDir.y) return;
    const nx=head.x+ex, ny=head.y+ey;
    if(nx<1||ny<1||nx>=C.gridW-1||ny>=C.gridH-1) return;
    if(menuSnake.some(s=>s.x===nx&&s.y===ny)) return;
    opts.push({ex,ey,dist:Math.abs(menuFood.x-nx)+Math.abs(menuFood.y-ny)});
  });
  if(opts.length){ opts.sort((a,b)=>a.dist-b.dist); menuDir={x:opts[0].ex,y:opts[0].ey}; }
  const nh={x:head.x+menuDir.x,y:head.y+menuDir.y};
  if(nh.x<1||nh.y<1||nh.x>=C.gridW-1||nh.y>=C.gridH-1){ initMenuSnake(); return; }
  menuSnake.unshift(nh);
  if(nh.x===menuFood.x&&nh.y===menuFood.y){
    let fx,fy,att=0;
    do { fx=2+Math.floor(Math.random()*(C.gridW-4)); fy=2+Math.floor(Math.random()*(C.gridH-4)); att++; }
    while(menuSnake.some(s=>s.x===fx&&s.y===fy)&&att<80);
    menuFood={x:fx,y:fy};
  } else { menuSnake.pop(); }
}

// ═══════════════════════════════════════════════════════════════
// POPUPS
// ═══════════════════════════════════════════════════════════════
const shuffle=arr=>{ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };
const nextQuote=()=>{ if(qIdx>=qPool.length){qPool=shuffle([...QUOTES]);qIdx=0;} return qPool[qIdx++]; };

function spawnPopup(gx,gy){
  const text=nextQuote();
  const camP=isoPos(camX,camY), p=isoPos(gx,gy);
  const sx=canvas.width/2+p.x-camP.x;
  const sy=canvas.height/2+p.y-camP.y-30;
  const el=document.createElement('div');
  el.className='popup'; el.textContent=text;
  const maxW=Math.min(260,window.innerWidth*.66);
  el.style.cssText=`left:${Math.max(10,Math.min(sx-maxW/2,window.innerWidth-maxW-10))}px;top:${Math.max(54,Math.min(sy-20,window.innerHeight-110))}px;max-width:${maxW}px`;
  document.getElementById('popupLayer').appendChild(el);
  setTimeout(()=>el.remove(),3100);
}

// ═══════════════════════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════════════════════
function placeFood(){
  let fx,fy,att=0;
  do{ fx=2+Math.floor(Math.random()*(C.gridW-4)); fy=2+Math.floor(Math.random()*(C.gridH-4)); att++; }
  while(snake.some(s=>s.x===fx&&s.y===fy)&&att<200);
  food={x:fx,y:fy};
}
function moveSnake(){
  dir={...nextDir};
  const head=snake[0];
  const nh={x:head.x+dir.x,y:head.y+dir.y};
  if(nh.x<0||nh.y<0||nh.x>=C.gridW||nh.y>=C.gridH){ doGameOver(); return; }
  if(snake.some((s,i)=>i>0&&s.x===nh.x&&s.y===nh.y)){ doGameOver(); return; }
  snake.unshift(nh);
  if(nh.x===food.x&&nh.y===food.y){
    score++;
    if(score>highScore){highScore=score;localStorage.setItem('lsnHS',highScore);}
    document.getElementById('scoreVal').textContent=score;
    document.getElementById('levelVal').textContent='Nivå '+(Math.floor(score/5)+1);
    speed=Math.max(C.minSpeed,C.initSpeed-score*C.speedStep);
    const camP=isoPos(camX,camY), fp=isoPos(food.x,food.y);
    spawnPopup(food.x,food.y);
    spawnParticles(canvas.width/2+fp.x-camP.x, canvas.height/2+fp.y-camP.y-30);
    Audio.eat(); placeFood();
  } else { snake.pop(); }
  camTX=snake[0].x; camTY=snake[0].y;
}
function doGameOver(){
  Audio.stopMusic(); Audio.die(); setState(ST.GAMEOVER);
  document.getElementById('finalScore').textContent=score;
  document.getElementById('goHs').innerHTML='Rekord: <strong>'+highScore+'</strong>';
}

// ═══════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════
function setDir(d){
  if(state!==ST.PLAYING) return;
  if(d.x===-dir.x&&d.y===-dir.y) return;
  if(d.x===-nextDir.x&&d.y===-nextDir.y) return;
  nextDir=d;
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'   ||e.key==='w'||e.key==='W') setDir({x:0,y:-1});
  if(e.key==='ArrowDown' ||e.key==='s'||e.key==='S') setDir({x:0,y:1});
  if(e.key==='ArrowLeft' ||e.key==='a'||e.key==='A') setDir({x:-1,y:0});
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') setDir({x:1,y:0});
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){
    if(state===ST.PLAYING) togglePause();
    else if(state===ST.PAUSED) resumeGame();
  }
});
let tx0=0,ty0=0;
document.addEventListener('touchstart',e=>{e.preventDefault();tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:false});
document.addEventListener('touchend',e=>{
  e.preventDefault();
  const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  if(Math.max(Math.abs(dx),Math.abs(dy))<18) return;
  if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?{x:1,y:0}:{x:-1,y:0});
  else setDir(dy>0?{x:0,y:1}:{x:0,y:-1});
  if(state===ST.PAUSED) resumeGame();
},{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ═══════════════════════════════════════════════════════════════
// UI / STATE
// ═══════════════════════════════════════════════════════════════
function setState(s){
  state=s;
  document.getElementById('menuScreen').classList.toggle('hidden',s!==ST.MENU);
  document.getElementById('pauseScreen').classList.toggle('hidden',s!==ST.PAUSED);
  document.getElementById('gameOverScreen').classList.toggle('hidden',s!==ST.GAMEOVER);
  document.getElementById('hud').classList.toggle('hidden',s===ST.MENU||s===ST.GAMEOVER);
  document.getElementById('sfxBtn').classList.toggle('hidden',s===ST.MENU);
}
function startGame(){
  Audio.init(); Audio.resume();
  const cx=Math.floor(C.gridW/2), cy=Math.floor(C.gridH/2);
  snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; speed=C.initSpeed; moveAcc=0;
  camX=cx; camY=cy; camTX=cx; camTY=cy;
  qPool=shuffle([...QUOTES]); qIdx=0;
  document.getElementById('scoreVal').textContent='0';
  document.getElementById('levelVal').textContent='Nivå 1';
  document.getElementById('popupLayer').innerHTML='';
  particles.length=0;
  placeFood(); setState(ST.PLAYING);
  Audio.startMusic(); Audio.start(); lastTs=0;
}
function togglePause(){ if(state===ST.PLAYING){Audio.stopMusic();setState(ST.PAUSED);} }
function resumeGame(){ if(state===ST.PAUSED){setState(ST.PLAYING);Audio.startMusic();lastTs=0;} }
function goToMenu(){
  Audio.stopMusic(); setState(ST.MENU);
  document.getElementById('popupLayer').innerHTML=''; particles.length=0;
  document.getElementById('menuHs').innerHTML='Rekord: <strong>'+highScore+'</strong>';
}
function toggleSound(){
  Audio.init(); const on=!Audio.enabled; Audio.setEnabled(on);
  const icon=on?'🔊':'🔇';
  document.getElementById('sfxBtn').textContent=icon;
  document.getElementById('menuSfxBtn').textContent=icon+' Lyd '+(on?'på':'av');
}

// ═══════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════
function loop(ts){
  const dt=Math.min(ts-(lastTs||ts),100);
  lastTs=ts;
  if(state===ST.PLAYING){
    const lp=.13; camX+=(camTX-camX)*lp; camY+=(camTY-camY)*lp;
    moveAcc+=dt;
    if(moveAcc>=speed){ moveAcc-=speed; moveSnake(); }
    renderBG();
    renderScene(snake,food,{x:camX,y:camY});
    updateParticles(dt); drawParticles();
  } else if(state===ST.PAUSED){
    renderBG(); renderScene(snake,food,{x:camX,y:camY});
  } else {
    renderMenuBG(dt);
  }
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
initMenuSnake();
document.getElementById('menuHs').innerHTML='Rekord: <strong>'+highScore+'</strong>';
setState(ST.MENU);
requestAnimationFrame(loop);
</script>
